[project]
name = "ofp-vision"
version = "0.1.0"
description = "Camera-driven stretch perception service for the One Piece Devil Fruit project"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.1.1",
    "numpy>=2.5,<3",
    "opencv-contrib-python>=4.11,<5",
    "websockets>=13",
    "pygrabber>=0.2",
    # The skin stretch effect: drawn on the graphics card, physics compiled.
    "moderngl>=5.13",
    "numba>=0.68",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ofp-vision = "ofp_vision.server:main"
ofp-fetch-models = "ofp_vision.tools.fetch_models:main"
ofp-probe = "ofp_vision.tools.probe_client:main"
ofp-replay = "ofp_vision.tools.replay:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ofp_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
